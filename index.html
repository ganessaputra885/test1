<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Sparepart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <header class="mb-8 flex flex-col gap-4 rounded-3xl border border-slate-200 bg-white/80 p-5 shadow-soft backdrop-blur-sm md:flex-row md:items-center md:justify-between">
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-[0.22em] text-sky-600">Dashboard</p>
          <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">Inventory Sparepart</h1>
        </div>
        <div>
          <button id="openCategoryModalBtn" type="button" class="inline-flex items-center gap-1.5 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700">
            + Tambah Kategori
          </button>
        </div>
      </header>

      <section class="mb-8 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft">
          <span class="block text-sm font-medium text-slate-500">Total Item</span>
          <strong id="totalItems" class="mt-3 block text-3xl font-bold text-slate-900">0</strong>
        </div>
        <div class="rounded-2xl border border-amber-200 bg-amber-50 p-5 shadow-soft">
          <span class="block text-sm font-medium text-amber-700">Stok Rendah</span>
          <strong id="lowStockCount" class="mt-3 block text-3xl font-bold text-amber-600">0</strong>
        </div>
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 shadow-soft">
          <span class="block text-sm font-medium text-emerald-700">Total Stok</span>
          <strong id="totalStock" class="mt-3 block text-3xl font-bold text-emerald-600">0</strong>
        </div>
        <div class="rounded-2xl border border-sky-200 bg-sky-50 p-5 shadow-soft">
          <span class="block text-sm font-medium text-sky-700">Nilai Inventory</span>
          <strong id="totalValue" class="mt-3 block text-2xl font-bold text-sky-700">Rp 0</strong>
        </div>
      </section>

      <section class="mb-8 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft">
        <div class="border-b border-slate-200 bg-slate-50 px-5 py-4">
          <h2 class="text-xl font-bold text-slate-900">Tambah Sparepart</h2>
        </div>
        <form id="sparepartForm" class="grid gap-4 p-5 md:grid-cols-2 xl:grid-cols-3">
          <div class="flex flex-col gap-2">
            <label for="name" class="text-sm font-medium text-slate-600">Nama Sparepart</label>
            <input id="name" name="name" type="text" placeholder="Contoh: Filter Oli" required class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2">
            <label for="sku" class="text-sm font-medium text-slate-600">SKU</label>
            <input id="sku" name="sku" type="text" placeholder="SP-001" required class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <label for="category" class="text-sm font-medium text-slate-600">Kategori</label>
              <button type="button" id="quickAddCategoryBtn" class="text-xs font-semibold text-sky-600 hover:text-sky-700">+ Tambah Baru</button>
            </div>
            <select id="category" name="category" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100">
            </select>
          </div>
          <div class="flex flex-col gap-2">
            <label for="stock" class="text-sm font-medium text-slate-600">Stok</label>
            <input id="stock" name="stock" type="number" min="0" value="0" required class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2">
            <label for="minStock" class="text-sm font-medium text-slate-600">Minimal Stok</label>
            <input id="minStock" name="minStock" type="number" min="0" value="5" required class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2">
            <label for="price" class="text-sm font-medium text-slate-600">Harga Satuan</label>
            <input id="price" name="price" type="number" min="0" value="0" required class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2">
            <label for="location" class="text-sm font-medium text-slate-600">Lokasi</label>
            <input id="location" name="location" type="text" placeholder="Rak A-01" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="flex flex-col gap-2 md:col-span-2 xl:col-span-1">
            <label for="image" class="text-sm font-medium text-slate-600">Gambar Barang</label>
            <input id="image" name="image" type="file" accept="image/*" class="block w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
          </div>
          <div class="md:col-span-2 xl:col-span-3">
            <div class="flex flex-col gap-2">
              <label for="notes" class="text-sm font-medium text-slate-600">Catatan</label>
              <textarea id="notes" name="notes" rows="3" placeholder="Catatan tambahan..." class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100"></textarea>
            </div>
          </div>
          <div class="md:col-span-2 xl:col-span-3 hidden" id="imagePreviewWrap">
            <div class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-3">
              <img id="imagePreview" alt="Preview gambar barang" class="h-20 w-20 rounded-xl object-cover ring-1 ring-slate-200" />
              <span class="text-sm font-medium text-slate-600">Preview gambar barang</span>
            </div>
          </div>
          <div class="md:col-span-2 xl:col-span-3 flex items-center justify-end gap-3 pt-2">
            <button type="button" id="cancelEditBtn" class="hidden rounded-xl border border-rose-200 bg-rose-50 px-4 py-2.5 text-sm font-semibold text-rose-600 transition hover:bg-rose-100">Batal Edit</button>
            <button type="submit" id="submitBtn" class="rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200">Simpan Sparepart</button>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-soft">
        <div class="flex flex-col gap-3 border-b border-slate-200 bg-slate-50 px-5 py-4 md:flex-row md:items-center md:justify-between">
          <h2 class="text-xl font-bold text-slate-900">Daftar Sparepart</h2>
          <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap">
            <input id="searchInput" type="search" placeholder="Cari nama / SKU" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100 sm:w-48" />
            <select id="categoryFilter" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100">
              <option value="all">Semua Kategori</option>
            </select>
            <select id="sortSelect" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100">
              <option value="default">Urutkan: Default</option>
              <option value="price-asc">Harga Terendah</option>
              <option value="price-desc">Harga Tertinggi</option>
              <option value="category">Kategori</option>
              <option value="stock-asc">Stok Terendah</option>
              <option value="location">Lokasi</option>
              <option value="sku">SKU</option>
            </select>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Nama</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">SKU</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Kategori</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Stok</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Min</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Harga</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Lokasi</th>
                <th class="px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500">Aksi</th>
              </tr>
            </thead>
            <tbody id="sparepartTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
          </table>
        </div>
      </section>
    </div>

    <dialog id="categoryModal" class="m-auto rounded-3xl border border-slate-200 bg-white p-6 shadow-2xl backdrop:bg-slate-900/40 w-full max-w-sm">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">Tambah Kategori</h3>
        <button type="button" id="closeCategoryModalBtn" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
      </div>
      <form id="categoryForm" class="mt-4 flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <label for="newCategoryName" class="text-xs font-medium text-slate-600">Nama Kategori</label>
          <input id="newCategoryName" type="text" placeholder="Contoh: Suspensi" required class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
        </div>
        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" id="cancelCategoryModalBtn" class="rounded-xl border border-slate-200 bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-200">Batal</button>
          <button type="submit" class="rounded-xl bg-sky-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-sky-500">Simpan Kategori</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
